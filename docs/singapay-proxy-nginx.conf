# SingaPay static-IP reverse proxy (nginx) — reference config
#
# Purpose: Cloudflare Workers have no static egress IP, but SingaPay requires
# the calling IP to be registered (ip.whitelisted.merchant). This proxy gives
# the Worker a fixed egress IP:
#
#   tokko-api (Worker) ──https──▶ VPS nginx (static IP) ──https──▶ singapay
#
# Worker side: set SINGAPAY_PROXY_URL=https://your-vps.example.com/singapay
# (and SINGAPAY_PROXY_TOKEN to match the secret below). The client keeps
# calling `${apiUrl}/api/v1.0/...`; this location strips the /singapay prefix
# and forwards to the SingaPay API host untouched.
#
# Setup on the VPS:
#   1. Point a subdomain (e.g. proxy.yourdomain.com) at the VPS IP (A record).
#   2. Get a TLS cert:  sudo certbot certonly --nginx -d proxy.yourdomain.com
#   3. Put this file in /etc/nginx/sites-available/singapay-proxy and symlink
#      it into sites-enabled, replacing the placeholders.
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Register the VPS IP (or 0.0.0.0/0 for the sandbox) in the SingaPay
#      merchant dashboard / with support.

server {
    listen 443 ssl http2;
    server_name proxy.yourdomain.com;   # ← replace

    ssl_certificate     /etc/letsencrypt/live/proxy.yourdomain.com/fullchain.pem;  # ← replace
    ssl_certificate_key /etc/letsencrypt/live/proxy.yourdomain.com/privkey.pem;    # ← replace

    # Only the SingaPay API paths — everything else 404s.
    location /singapay/ {
        # Shared-secret guard: must match the worker's SINGAPAY_PROXY_TOKEN.
        # Generate one:  openssl rand -hex 32
        if ($http_x_proxy_token != "CHANGE_ME_LONG_RANDOM_HEX") {   # ← replace
            return 403;
        }

        # Strip /singapay/ and forward to the SingaPay API host.
        proxy_pass https://sandbox-payment-b2b.singapay.id/;
        proxy_set_header Host sandbox-payment-b2b.singapay.id;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name proxy.yourdomain.com;   # ← replace
    return 301 https://$host$request_uri;
}
